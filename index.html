<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyse Post LinkedIn</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f9f9f9; }
    h2 { font-size: 18px; font-weight: 500; margin-bottom: 24px; }
    .card { background: white; border: 1px solid #e5e5e5; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .card h3 { font-size: 12px; font-weight: 500; color: #666; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; margin-top: 12px; }
    input, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    textarea { min-height: 120px; resize: vertical; font-family: sans-serif; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { width: 100%; margin-top: 16px; padding: 12px; background: #0070f3; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 500; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px; display: none; }
    .ok { background: #d4edda; color: #155724; display: block; }
    .err { background: #f8d7da; color: #721c24; display: block; }
    .loading { background: #e2e3e5; color: #383d41; display: block; }
    .badge { display: inline-block; background: #e3f2fd; color: #0c447c; padding: 6px 14px; border-radius: 6px; font-size: 14px; font-weight: 500; margin-top: 12px; }
    .progress { margin: 12px 0; display: none; }
    .step { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; margin-bottom: 6px; }
    .step-num { width: 22px; height: 22px; border-radius: 50%; background: #ccc; color: white; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; flex-shrink: 0; }
    .step-num.active { background: #0070f3; }
    .step-num.done { background: #28a745; }
  </style>
</head>
<body>
  <h2>Analyse Post LinkedIn</h2>

  <div class="card">
    <h3>Infos du post</h3>
    <div class="grid">
      <div>
        <label>Date du post</label>
        <input type="date" id="date-post">
      </div>
      <div>
        <label>URL du post</label>
        <input type="text" id="url-post" placeholder="https://www.linkedin.com/feed/update/...">
      </div>
    </div>
    <label>Texte du post</label>
    <textarea id="post-text" placeholder="Colle le texte du post LinkedIn ici..."></textarea>
  </div>

  <div class="progress" id="progress">
    <div class="step"><div class="step-num" id="s1">1</div> Analyse du thème via Gemini</div>
    <div class="step"><div class="step-num" id="s2">2</div> Connexion à Google Sheets</div>
    <div class="step"><div class="step-num" id="s3">3</div> Enregistrement dans le fichier</div>
  </div>

  <div id="theme-result"></div>
  <button onclick="analyserPost()" id="btn">Analyser et enregistrer</button>
  <div id="status" class="status"></div>

  <script>
    const GEMINI_KEY = "AIzaSyAQ.Ab8RN6IPkQVBNH8dneWPrJQnJOWQjy__zUKqT5yp6y35opD8PA";
    const SHEET_ID = "1k5wdO6C0mxYfEcJZWaZlPDKgiledHW7QZ0a3PzecijM";
    const CLIENT_ID = "181703028018-q3rm07plk5vdjj68md5iorosqmi2u31c.apps.googleusercontent.com";
    const SCOPES = "https://www.googleapis.com/auth/spreadsheets";
    let accessToken = null;

    document.getElementById("date-post").value = new Date().toISOString().split("T")[0];

    function setStatus(msg, type) {
      const el = document.getElementById("status");
      el.className = "status " + type;
      el.textContent = msg;
    }

    function stepActive(n) {
      document.getElementById("s" + n).classList.add("active");
    }

    function stepDone(n) {
      const el = document.getElementById("s" + n);
      el.classList.remove("active");
      el.classList.add("done");
      el.textContent = "✓";
    }

    async function getToken() {
      return new Promise((resolve, reject) => {
        if (accessToken) { resolve(accessToken); return; }
        const client = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: (resp) => {
            if (resp.error) { reject(resp.error); return; }
            accessToken = resp.access_token;
            resolve(accessToken);
          }
        });
        client.requestAccessToken();
      });
    }

    function colToLetter(col) {
      let letter = "";
      while (col > 0) {
        let rem = (col - 1) % 26;
        letter = String.fromCharCode(65 + rem) + letter;
        col = Math.floor((col - 1) / 26);
      }
      return letter;
    }

    async function analyserPost() {
      const postText = document.getElementById("post-text").value.trim();
      const datePost = document.getElementById("date-post").value;
      const urlPost  = document.getElementById("url-post").value.trim();

      if (!postText) { setStatus("Colle le texte du post.", "err"); return; }
      if (!datePost) { setStatus("Indique la date du post.", "err"); return; }

      document.getElementById("btn").disabled = true;
      document.getElementById("progress").style.display = "block";
      document.getElementById("theme-result").innerHTML = "";

      try {
        // Étape 1 — Gemini analyse le thème
        stepActive(1);
        const geminiResp = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + GEMINI_KEY,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `Tu es un assistant spécialisé dans l'analyse de contenu LinkedIn pour la finance d'entreprise. Finance Control Tower est un SaaS B2B pour la consolidation et le reporting entre ERP et EPM. Réponds UNIQUEMENT avec le thème le plus adapté parmi cette liste fixe, sans aucun autre mot : Qualité de la donnée / Outils & automatisation / Rôle finance & Business Partner / Carrière finance / Management\n\nPost :\n${postText}` }] }],
              generationConfig: { temperature: 0.1, maxOutputTokens: 20 }
            })
          }
        );
        const geminiData = await geminiResp.json();
        const theme = geminiData.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "Qualité de la donnée";
        document.getElementById("theme-result").innerHTML = `<div class="badge">Thème détecté : ${theme}</div>`;
        stepDone(1);

        // Étape 2 — Auth Google
        stepActive(2);
        const token = await getToken();
        stepDone(2);

        // Trouve la prochaine colonne disponible
        const getResp = await fetch(
          `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/brut!1:1`,
          { headers: { Authorization: "Bearer " + token } }
        );
        const getData = await getResp.json();
        const row1 = getData.values?.[0] || [];
        const nextCol = row1.length + 1;
        const colLetter = colToLetter(nextCol);
        const dateFormatted = new Date(datePost + "T12:00:00").toLocaleDateString("fr-FR");

        // Étape 3 — Écrit date + URL + thème en lignes 1, 2, 3
        stepActive(3);
        await fetch(
          `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/brut!${colLetter}1:${colLetter}3?valueInputOption=USER_ENTERED`,
          {
            method: "PUT",
            headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
            body: JSON.stringify({ values: [[dateFormatted], [urlPost || ""], [theme]] })
          }
        );
        stepDone(3);

        setStatus("Enregistré ! Synchronisation du CRM en cours...", "loading");
        await fetch("https://script.google.com/macros/s/AKfycbwSn6PL1HMy9LAc-hvpEt7dXUDznXcqiyXtgkQ4so938phYCwOdpkZoN2fEVeVhY_vo/exec", { mode: "no-cors" });
        setStatus("Enregistré et CRM synchronisé !", "ok");
        document.getElementById("post-text").value = "";
        document.getElementById("url-post").value = "";
        document.getElementById("date-post").value = new Date().toISOString().split("T")[0];

      } catch(e) {
        setStatus("Erreur : " + e.message, "err");
      }

      document.getElementById("btn").disabled = false;
    }
  </script>
  <script src="https://accounts.google.com/gsi/client"></script>
</body>
</html>
